name: BOK economic schedule validation
on:
  push:
    branches: [feat/nh-integration-v2]
    paths:
      - 'js/economic-bok-*.js'
      - 'scripts/collect-bok-calendar.cjs'
      - 'tests/economic-bok-*.js'
      - 'tests/economic-bok-*.cjs'
      - '.github/workflows/economic-bok.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-public-dev-snapshots
  cancel-in-progress: false
jobs:
  validate-and-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nh-integration-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict BOK source and calendar unit tests
        run: |
          node --check js/economic-bok-policy.js
          node --check js/economic-bok-stats-parser.js
          node --check js/economic-bok-stats-calendar.js
          node --check scripts/collect-bok-calendar.cjs
          node tests/economic-bok-parser.test.js
          node tests/economic-bok-calendar.test.js
          node tests/economic-bok-collector.test.cjs
      - name: Fetch BOK official HTML release schedule
        run: node scripts/collect-bok-calendar.cjs
      - name: Commit verified BOK schedule snapshot to dev only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/bok-stats-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(economic-calendar): refresh verified BOK publication schedule'
            git push origin HEAD:feat/nh-integration-v2
          fi
