name: Market session context isolated offline tests
on:
  push:
    branches:
      - feat/market-session-context-isolated
permissions:
  contents: read
jobs:
  offline-only:
    name: KST/US-DST and market clock tests, no NH/GAS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          node --check js/market-evidence-gate-v1.js
          node --check js/market-quality-diagnostics-v1.js
          node --check js/market-session-context-v1.js
          node --check tools/inspect_market_session_context_v1.cjs
      - name: Offline evidence, diagnostics and session/CLI tests
        run: |
          node tests/market-evidence-gate-v1.test.cjs
          node tests/market-quality-diagnostics-v1.test.cjs
          node tests/market-session-context-v1.test.cjs
          node tests/market-session-cli-v1.test.cjs
