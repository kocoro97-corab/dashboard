name: PR regression tests
on:
  pull_request:
  push:
    branches: ['fix/**', 'main', 'feat/nh-integration-v2', 'feat/mobile-sector-news-calendar-ui-20261126']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regressions and GAS syntax
        run: |
          for file in tests/*.test.cjs tests/*.test.js; do node "$file" || exit 1; done
          node -e "const fs=require('fs'),vm=require('vm');for(const dir of ['js','gas'])for(const name of fs.readdirSync(dir))if(/\.(js|gs)$/.test(name))new vm.Script(fs.readFileSync(dir+'/'+name,'utf8'),{filename:name})"
      - name: Python storage/deployment/master regressions
        run: |
          python3 -m compileall -q tests
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser test dependency
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install playwright==1.56.0
          .venv-browser/bin/python -m playwright install --with-deps chromium
      - name: Synthetic browser regression (no Google or NH secrets)
        run: |
          result=0
          failures=()
          run_browser() {
            if ! .venv-browser/bin/python "$@"; then
              failures+=("$1")
              result=1
            fi
          }
          run_browser tests/browser_external.py
          run_browser tests/browser_diagnostics.py
          run_browser tests/browser_native_snapshot.py
          run_browser tests/browser_relay.py
          run_browser tests/browser_persistent_relay.py
          run_browser tests/browser_https_dev.py
          run_browser tests/browser_dev_connection_errors.py
          run_browser tests/browser_public_market.py
          run_browser tests/browser_relay_busy.py
          run_browser tests/browser_futures_display.py
          run_browser tests/browser_manual_preview.py
          run_browser tests/browser_account_inquiry.py
          run_browser tests/browser_app_shell.py
          run_browser tests/browser_market_sector_recheck.py
          run_browser tests/browser_integration_958.py
          run_browser tests/browser_sector_followup.py
          run_browser tests/browser_names_review.py
          run_browser tests/browser_invest_workflow.py
          run_browser tests/browser_public_briefing.py
          run_browser tests/browser_final_integration.py
          run_browser tests/browser_dense_review.py --widths 1440 344 --scales 1 1.5 --output /tmp/dense-ci
          run_browser tests/browser_work_handoff.py
          run_browser tests/browser_commit_review.py --extended
          run_browser tests/browser_external_catalog.py
          run_browser tests/browser_calendar_final.py
          run_browser tests/browser_calendar_oauth_bootstrap.py
          run_browser tests/browser_accounts_profile.py
          if (( result )); then printf "Failed browser regressions: %s\n" "${failures[*]}"; fi
          exit "$result"
  nh-staging-live:
    # Security/preflight preparation branches never consume live credentials in CI.
    if: github.event_name == 'pull_request' && github.head_ref != 'fix/issue-4-safe-diagnostics' && github.head_ref != 'fix/4b1-safety-checks' && github.head_ref != 'feat/nh-integration-v2' && github.head_ref != 'fix/visible-first-market-20261125' && github.head_ref != 'fix/visible-first-data-20261125' && github.head_ref != 'fix/relay-timing-diagnostics-20261125' && github.head_ref != 'fix/relay-retry-isolation-preview-20261126' && github.head_ref != 'feat/mobile-sector-news-calendar-ui-20261126' && github.head_ref != 'fix/verified-query-performance-20261126' && github.event.pull_request.head.repo.full_name == github.repository && vars.NH_STAGING_ENABLED == 'true'
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nh-staging
    concurrency:
      group: nh-staging-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Explicitly isolated live NH and GAS checks
        env:
          NH_STAGING_URL: ${{ secrets.NH_STAGING_URL }}
          NH_STAGING_SCRIPT_ID: ${{ secrets.NH_STAGING_SCRIPT_ID }}
          NH_STAGING_SHEET_ID: ${{ secrets.NH_STAGING_SHEET_ID }}
          NH_STAGING_USER: ${{ secrets.NH_STAGING_USER }}
          NH_STAGING_PASSWORD: ${{ secrets.NH_STAGING_PASSWORD }}
        run: python3 tools/nh_staging_test.py --allow-staging-write --report /tmp/nh-staging-report.json
      - name: Safe staging result summary
        if: always()
        run: |
          if test -f /tmp/nh-staging-report.json; then
            python3 -c 'import os,pathlib;report=pathlib.Path("/tmp/nh-staging-report.json").read_text();open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## NH staging result\n\n```json\n"+report+"\n```\n")'
          fi
