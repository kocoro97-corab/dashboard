<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버튼 테스트</title>
<style>
:root{--bg:#0b1220;--panel:#121c2d;--line:#26364d;--text:#edf3fb;--blue:#4d94ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:92vh;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:320px;text-align:center}
input{width:100%;padding:12px;margin-bottom:10px;background:#172338;border:1px solid var(--line);color:#fff;border-radius:8px}
button{width:100%;padding:14px;background:var(--blue);color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div class="box">
  <h2>🔍 강제 테스트</h2>
  <p style="color:#91a2ba;font-size:12px;margin-bottom:16px">버튼이 눌리는지 확인하는 테스트 화면입니다.</p>
  <input type="text" id="uid" placeholder="아이디">
  <input type="password" id="upw" placeholder="비밀번호">
  <button onclick="doTestLogin()">로그인 버튼 테스트</button>
  <div id="msg" style="margin-top:12px;color:#ff4d4d;font-size:12px"></div>
</div>

<script>
function doTestLogin(){
  const id = document.getElementById('uid').value;
  const pw = document.getElementById('upw').value;
  alert("버튼 클릭됨! 아이디: " + (id || "없음"));
  document.getElementById('msg').textContent = "클릭 이벤트 정상 작동 확인됨!";
}
</script>

</body>
</html>
